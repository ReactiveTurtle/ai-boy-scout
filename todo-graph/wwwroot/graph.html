<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173c36">
  <title>Todo Graph · Граф задач</title>
  <link rel="stylesheet" href="/agent.css">
  <link rel="stylesheet" href="/graph.css">
  <link rel="stylesheet" href="/folder-picker.css">
</head>
<body>
  <header class="graph-topbar">
    <a class="graph-brand" href="/" aria-label="Todograph"><span class="graph-brand-mark">t</span><span>todo<span>graph</span></span></a>
    <nav class="graph-nav" aria-label="Основная навигация"><a class="active" href="/graph.html">Граф задач</a><a href="/projects.html">Проекты</a><a href="/index.html">Кандидаты</a><a href="/settings.html">Настройки</a></nav>
    <label class="global-search"><span aria-hidden="true">⌕</span><input type="search" placeholder="Поиск задач, файлов, зависимостей…"><kbd>Ctrl K</kbd></label>
    <div class="notification-control"><button class="top-icon" id="notifications-toggle" type="button" aria-label="Уведомления" aria-expanded="false" aria-controls="notifications-popover">♧<i aria-hidden="true"></i></button><section class="notifications-popover" id="notifications-popover" aria-label="Требуют вашего действия" hidden><h2>Требуют вашего действия</h2><div id="notification-list"></div><p id="notification-empty" hidden>Нет задач, ожидающих вашего действия.</p></section></div><span class="graph-avatar" aria-label="Пользователь">А</span>
  </header>
  <main class="graph-workspace">
    <aside class="node-sidebar">
      <div class="node-sidebar-heading"><h1>Задачи</h1><div class="node-sidebar-actions"><span class="total-pill" id="node-count">—</span></div></div>
      <div class="node-search-row"><label class="node-search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"></circle><path d="m13 13 4 4"></path></svg><input id="node-search" type="search" placeholder="Найти задачу…"></label><button class="filter-button" type="button" aria-label="Фильтр">☷</button></div>
      <div class="node-filters" role="tablist" aria-label="Тип узлов"><button class="active" data-kind="all">Все <span id="filter-all-count">0</span></button><button data-kind="candidate">Кандидаты <span id="filter-candidate-count">0</span></button><button data-kind="task">Задачи <span id="filter-task-count">0</span></button></div>
      <label class="project-filter">Проект<select id="project-filter"><option value="all">Все проекты</option></select></label>
      <div id="node-list" class="node-list"><p class="loading">Загружаю граф…</p></div>
      <button class="sidebar-collapse" type="button" aria-label="Свернуть список">‹</button>
    </aside>
    <section class="graph-main">
      <div class="graph-toolbar"><div class="toolbar-left"><button type="button" id="auto-layout">♧ <span>Авторазкладка</span></button><button type="button" id="show-all">◉ <span>Показать все</span></button><label class="direction-control"><span>↔</span><select id="graph-direction" aria-label="Направление графа"><option value="right">Слева → направо</option><option value="down">Сверху → вниз</option></select></label></div><div class="graph-zoom-controls" role="group" aria-label="Масштаб графа"><button type="button" id="zoom-out" aria-label="Уменьшить масштаб">−</button><span id="zoom-level">100%</span><button type="button" id="zoom-in" aria-label="Увеличить масштаб">＋</button><button type="button" id="zoom-reset" aria-label="Во весь экран">⛶</button></div><span id="edge-count" hidden></span></div>
      <div class="graph-viewport" id="graph-viewport"><div id="graph-canvas" class="graph-canvas"><div id="graph-surface" class="graph-surface"><div class="loading">Загружаю узлы…</div></div></div><div class="graph-minimap" id="graph-minimap" aria-label="Миникарта графа"></div></div>
    </section>
    <aside id="inspector" class="node-inspector"><div class="inspector-empty"><span>◎</span><strong>Выберите узел</strong><p>Здесь будут детали выбранной задачи или кандидата.</p></div></aside>
  </main>
  <script src="/graph.js" defer></script>
</body>
</html>
