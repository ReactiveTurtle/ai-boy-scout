<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Todo Graph · Проект</title><link rel="stylesheet" href="/agent.css"><link rel="stylesheet" href="/projects.css"><link rel="stylesheet" href="/project.css"></head>
<body><header class="graph-topbar"><a class="graph-brand" href="/projects.html"><span class="graph-brand-mark">t</span><span>todo<span>graph</span></span></a><nav class="graph-nav"><a href="/graph.html">Граф задач</a><a class="active" href="/projects.html">Проекты</a><a href="/index.html">Кандидаты</a><a href="/settings.html">Настройки</a></nav><span class="graph-avatar">А</span></header>
<main class="project-page"><a href="/projects.html">← Все проекты</a><header class="project-heading"><div><span class="overline">Рабочее пространство проекта</span><h1 id="project-name">Загружаю…</h1><p id="project-path"></p></div><a id="graph-link" href="/graph.html">Открыть глобальный граф →</a></header>
<div class="project-columns"><section class="project-panel"><div class="project-section-heading"><h2>Задачи</h2><button id="refresh-project" type="button">Обновить</button></div><div id="task-list" aria-live="polite">Загружаю задачи…</div><details class="project-link-details"><summary>Связать задачу другого проекта</summary><form id="task-link-form" class="project-link-form"><label>Задача этого проекта<select name="taskId" required></select></label><label>Связанная задача<select name="relatedTaskId" required></select></label><a class="show-graph-button" id="related-task-graph-link" href="/graph.html" hidden>Показать выбранную задачу в графе →</a><label>Связь<select name="relation"><option value="related">Связана</option><option value="duplicate">Дубликат</option><option value="depends_on">Зависит от</option><option value="blocks">Блокирует</option></select></label><button type="submit">Добавить связь</button><span role="status"></span></form></details></section>
<section class="project-panel"><div class="project-section-heading"><h2>Очередь кандидатов</h2><span id="candidate-count"></span></div><form id="raw-form"><label for="raw-text">Опишите задачу свободным текстом</label><textarea id="raw-text" name="text" maxlength="10000" required placeholder="Что нужно изменить и почему?"></textarea><button type="submit">Отправить на уточнение</button><span role="status" id="raw-status"></span></form><div id="candidate-list" aria-live="polite">Загружаю кандидатов…</div></section></div></main><script src="/project.js" defer></script></body></html>
